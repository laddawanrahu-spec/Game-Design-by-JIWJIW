<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Design by JIWJIW - Space Math Shooter</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0a12;
            color: #fff;
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Outer Frame / Game Canvas Container */
        #game-container {
            position: relative;
            width: 420px;
            height: 750px;
            background: #090914;
            border: 2px solid #2d2f4d;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 243, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }

        /* Top Header Area (SCORE & TIME) */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: #8f9bba;
            letter-spacing: 1px;
            background: linear-gradient(180deg, rgba(9, 9, 20, 0.9) 0%, rgba(9, 9, 20, 0) 100%);
        }

        #score-val, #time-val {
            color: #00f3ff;
        }

        /* Circle Question Container (Fixed Top Center) */
        #question-circle {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px dashed #00f3ff;
            background: radial-gradient(circle, rgba(20, 24, 45, 0.8) 0%, rgba(9, 9, 20, 0.95) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        #question-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 15px;
            color: #00f3ff;
            text-align: center;
        }

        /* Canvas for Stars, Meteors, Rockets & Bullets */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Start / Register Overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 20, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 20px;
            text-align: center;
        }

        .title-main {
            font-family: 'Press Start 2P', monospace;
            font-size: 15px;
            color: #00f3ff;
            text-shadow: 2px 2px #ff0055, -2px -2px #00f3ff;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .title-sub {
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .instruction-text {
            font-size: 13px;
            color: #00f3ff;
            margin-bottom: 15px;
        }

        .login-form {
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-box {
            width: 100%;
            padding: 12px 15px;
            background: #121324;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .input-box::placeholder {
            color: #5d6785;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            background: #ff0055;
            border: 2px solid #ff3377;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #990033, 0 0 15px rgba(255, 0, 85, 0.5);
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #990033;
        }

        /* On-Screen Mobile Controls (วิธียิง/เลื่อน) */
        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 11px;
            color: #5d6785;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Top Bar -->
    <div id="top-bar">
        <div>SCORE: <span id="score-val">0</span></div>
        <div>TIME: <span id="time-val">60s</span></div>
    </div>

    <!-- Center Circle Question Display -->
    <div id="question-circle">
        <div id="question-text">1+1=?</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <div id="controls-hint">กด ← → / A D ควบคุม | Spacebar ยิง<br>(หรือ ลาก/แตะที่จอ เพื่อเลื่อนยานและยิง)</div>

    <!-- Login / Registration Modal -->
    <div id="start-overlay">
        <div class="title-main">Game Design by JIWJIW</div>
        <div class="title-sub">จรวดตะลุยอวกาศ</div>
        <div class="instruction-text">กรอกชื่อเพื่อลงทะเบียนเริ่มเล่น</div>
        
        <form class="login-form" onsubmit="startGame(event)">
            <input type="text" id="player-name" class="input-box" placeholder="ชื่อผู้เล่น / ชื่อเล่น" required autocomplete="off">
            <button type="submit" class="btn-start">START GAME</button>
        </form>
    </div>
</div>

<script>
    // Web Audio API Sound System
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
    }

    function playLaserSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(700, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playCorrectSound() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); 
        osc.frequency.setValueAtTime(659.25, now + 0.08); 
        osc.frequency.setValueAtTime(783.99, now + 0.16); 
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
    }

    function playWrongSound() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.setValueAtTime(90, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    resizeCanvas();

    // Stars background
    const stars = Array.from({ length: 60 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.8 + 0.3
    }));

    // Player Rocket State
    const player = {
        x: canvas.width / 2,
        y: canvas.height - 80,
        width: 32,
        height: 42,
        speed: 6
    };

    // Controls Handling
    const keys = { Left: false, Right: false, Space: false, canShoot: true };

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = true;
        if (e.code === 'Space') {
            if (keys.canShoot && isGameRunning) {
                shootBullet();
                keys.canShoot = false;
            }
            keys.Space = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = false;
        if (e.code === 'Space') {
            keys.Space = false;
            keys.canShoot = true;
        }
    });

    // Touch / Pointer controls (ลากจรวด + แตะยิง)
    let isTouching = false;
    canvas.addEventListener('pointerdown', (e) => {
        if (!isGameRunning) return;
        isTouching = true;
        movePlayerToPointer(e);
        shootBullet();
    });

    canvas.addEventListener('pointermove', (e) => {
        if (isTouching && isGameRunning) {
            movePlayerToPointer(e);
        }
    });

    canvas.addEventListener('pointerup', () => isTouching = false);

    function movePlayerToPointer(e) {
        const rect = canvas.getBoundingClientRect();
        const touchX = e.clientX - rect.left;
        player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, touchX));
    }

    // Game Entities
    let bullets = [];
    let meteors = [];
    let score = 0;
    let time = 60;
    let timerInterval = null;
    let currentQuestion = { num1: 0, num2: 0, answer: 0 };
    let isGameRunning = false;
    let playerName = "";

    function shootBullet() {
        bullets.push({
            x: player.x,
            y: player.y - 20,
            radius: 4,
            speed: 10
        });
        playLaserSound();
    }

    function startGame(e) {
        e.preventDefault();
        initAudio();

        playerName = document.getElementById('player-name').value.trim();
        if (!playerName) return;

        // CRM Leads Storage
        const leads = JSON.parse(localStorage.getItem('crm_leads') || '[]');
        leads.push({ name: playerName, timestamp: new Date().toISOString() });
        localStorage.setItem('crm_leads', JSON.stringify(leads));

        document.getElementById('start-overlay').style.display = 'none';

        score = 0;
        time = 60;
        document.getElementById('score-val').innerText = score;
        document.getElementById('time-val').innerText = time + 's';

        isGameRunning = true;
        generateQuestion();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            time--;
            document.getElementById('time-val').innerText = time + 's';
            if (time <= 0) endGame();
        }, 1000);

        requestAnimationFrame(gameLoop);
    }

    function generateQuestion() {
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const answer = num1 + num2;

        currentQuestion = { num1, num2, answer };
        document.getElementById('question-text').innerText = `${num1}+${num2}=?`;

        // สุ่มสร้างคำตอบ 3 ข้อสำหรับอุกกาบาตลอยลงมา
        let answers = [answer];
        while (answers.length < 3) {
            let wrongAns = answer + (Math.floor(Math.random() * 7) - 3);
            if (wrongAns > 0 && !answers.includes(wrongAns)) {
                answers.push(wrongAns);
            }
        }
        answers.sort(() => Math.random() - 0.5);

        // ตำแหน่ง 3 เลนสำหรับอุกกาบาตร่วงลงมา
        const laneWidth = canvas.width / 3;
        meteors = answers.map((val, idx) => ({
            x: laneWidth * idx + laneWidth / 2,
            y: -40 - (Math.random() * 50),
            radius: 28,
            value: val,
            speed: 1.2 + Math.random() * 0.6
        }));
    }

    function drawRocket(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // Flame effect
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(-6, 18);
        ctx.lineTo(0, 28 + Math.random() * 6);
        ctx.lineTo(6, 18);
        ctx.fill();

        // Main Body
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(-14, 12);
        ctx.lineTo(14, 12);
        ctx.closePath();
        ctx.fill();

        // Rocket Nose
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(-8, -5);
        ctx.lineTo(8, -5);
        ctx.closePath();
        ctx.fill();

        // Window
        ctx.fillStyle = '#00f3ff';
        ctx.beginPath();
        ctx.arc(0, -2, 5, 0, Math.PI * 2);
        ctx.fill();

        // Wings
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.moveTo(-14, 5);
        ctx.lineTo(-20, 16);
        ctx.lineTo(-14, 16);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(14, 5);
        ctx.lineTo(20, 16);
        ctx.lineTo(14, 16);
        ctx.fill();

        ctx.restore();
    }

    function gameLoop() {
        if (!isGameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Draw Background Stars
        ctx.fillStyle = "#ffffff";
        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) star.y = 0;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 2. Move Player Keyboard
        if (keys.Left && player.x > player.width/2) player.x -= player.speed;
        if (keys.Right && player.x < canvas.width - player.width/2) player.x += player.speed;

        // 3. Draw Player Rocket
        drawRocket(player.x, player.y);

        // 4. Update & Render Bullets
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff0055';
        bullets.forEach((b, bIdx) => {
            b.y -= b.speed;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();

            if (b.y < 0) bullets.splice(bIdx, 1);
        });
        ctx.shadowBlur = 0;

        // 5. Update & Render Meteors (Falling Answer Balls)
        meteors.forEach((m) => {
            m.y += m.speed;

            // Loop Meteor back to top if off-screen
            if (m.y - m.radius > canvas.height) {
                m.y = -40;
            }

            // Draw Meteor Bubble Body
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(20, 25, 50, 0.9)";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00f3ff";
            ctx.stroke();

            // Draw Answer Value
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px 'Press Start 2P', monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(m.value, m.x, m.y + 2);

            // Collision Detection Bullet vs Meteor
            bullets.forEach((b, bIdx) => {
                const dist = Math.hypot(b.x - m.x, b.y - m.y);
                if (dist < m.radius + b.radius) {
                    bullets.splice(bIdx, 1);

                    if (m.value === currentQuestion.answer) {
                        playCorrectSound();
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                        generateQuestion(); // New Question
                    } else {
                        playWrongSound();
                        score = Math.max(0, score - 5);
                        document.getElementById('score-val').innerText = score;
                        m.y = -60; // Respawn wrongly shot meteor
                    }
                }
            });
        });

        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        isGameRunning = false;
        clearInterval(timerInterval);
        alert(`หมดเวลา! คุณ ${playerName} ทำได้ ${score} คะแนน`);
        document.getElementById('start-overlay').style.display = 'flex';
    }
</script>
</body>
</html>
