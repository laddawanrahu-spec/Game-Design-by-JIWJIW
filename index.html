<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Design by JIWJIW - Galactic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Mitr:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            color: #fff;
            font-family: 'Mitr', sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #020208;
            overflow: hidden;
        }

        canvas#space-canvas, canvas#game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        canvas#space-canvas { z-index: 1; }
        canvas#game-canvas { z-index: 15; }

        /* 🌌 เอฟเฟกต์เนบิวลาเคลื่อนไหว */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 2;
            animation: nebulaPulse 12s ease-in-out infinite alternate;
        }

        .nebula-1 {
            top: -10%; left: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, #ff0077 0%, #7928ca 50%, transparent 70%);
        }

        .nebula-2 {
            bottom: -15%; right: -10%;
            width: 65vw; height: 65vw;
            background: radial-gradient(circle, #00f3ff 0%, #0d1b40 50%, transparent 70%);
            animation-delay: -6s;
        }

        .nebula-3 {
            top: 40%; left: 30%;
            width: 40vw; height: 40vw;
            background: radial-gradient(circle, #7928ca 0%, #ff0055 40%, transparent 70%);
            animation-duration: 16s;
        }

        @keyframes nebulaPulse {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 0.4; }
            50% { transform: scale(1.25) translate(3vw, 2vh) rotate(180deg); opacity: 0.65; }
            100% { transform: scale(0.95) translate(-2vw, -3vh) rotate(360deg); opacity: 0.4; }
        }

        /* 🪐 ไอคอนอวกาศลอย */
        .space-asset {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.6));
        }

        .astronaut-large {
            top: 10%; right: 8%;
            font-size: clamp(60px, 9vw, 110px);
            animation: floatAstronaut 8s ease-in-out infinite alternate;
        }

        @keyframes floatAstronaut {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-35px) rotate(12deg) scale(1.05); }
            100% { transform: translateY(15px) rotate(-8deg) scale(0.98); }
        }

        .planet-giant {
            bottom: 5%; left: 6%;
            font-size: clamp(80px, 12vw, 140px);
            animation: floatPlanet 10s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 30px rgba(255, 0, 119, 0.5));
        }

        @keyframes floatPlanet {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-40px) rotate(-20deg); }
        }

        .bg-rocket {
            position: absolute;
            font-size: 50px;
            z-index: 2;
            pointer-events: none;
            animation: rocketFly 14s linear infinite;
            filter: drop-shadow(0 0 20px #ff3300);
        }

        @keyframes rocketFly {
            0% { transform: translate(-10vw, 80vh) rotate(45deg) scale(0.6); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(110vw, -10vh) rotate(45deg) scale(1.2); opacity: 0; }
        }

        /* 🛸 Overlay หน้าเมนู */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 50; padding: 20px;
        }

        .energy-ring {
            position: absolute;
            width: clamp(380px, 45vw, 580px);
            height: clamp(380px, 45vw, 580px);
            border-radius: 50%;
            border: 2px dashed rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
            animation: spinRing 20s linear infinite;
            pointer-events: none;
            z-index: 4;
        }

        .energy-ring-2 {
            width: clamp(420px, 50vw, 640px);
            height: clamp(420px, 50vw, 640px);
            border: 2px solid rgba(255, 0, 119, 0.3);
            border-top-color: transparent; border-bottom-color: transparent;
            animation: spinRing 14s linear infinite reverse;
        }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        .glass-card-extreme {
            position: relative; z-index: 5;
            background: rgba(8, 11, 28, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 0 25px rgba(0, 243, 255, 0.2), 0 20px 50px rgba(0, 0, 0, 0.8);
            border-radius: 28px;
            padding: clamp(35px, 5vw, 50px) clamp(25px, 4vw, 45px);
            max-width: 480px; width: 100%; text-align: center;
            animation: cardGlowPulse 4s ease-in-out infinite alternate;
        }

        @keyframes cardGlowPulse {
            0% { border-color: #00f3ff; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.2); }
            100% { border-color: #ff0077; box-shadow: 0 0 50px rgba(255, 0, 119, 0.6), inset 0 0 30px rgba(255, 0, 119, 0.3); }
        }

        .title-main {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(15px, 2.3vw, 20px);
            color: #00f3ff;
            text-shadow: 3px 3px 0px #ff0077, -2px -2px 0px #020208, 0 0 15px rgba(0, 243, 255, 0.8);
            line-height: 1.5; margin-bottom: 15px;
        }

        .title-sub {
            font-size: 16px; color: #ffea00;
            text-shadow: 0 0 12px rgba(255, 234, 0, 0.6);
            margin-bottom: 25px; font-weight: 700;
        }

        .instruction-text { font-size: 14px; color: #a4b3d6; margin-bottom: 22px; }

        .input-box-neon {
            width: 100%; padding: 16px 22px;
            background: rgba(3, 5, 18, 0.9);
            border: 2px solid #00f3ff; border-radius: 14px;
            color: #ffffff; font-family: 'Mitr', sans-serif; font-size: 16px;
            text-align: center; outline: none; margin-bottom: 18px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            transition: all 0.3s;
        }

        .input-box-neon:focus {
            border-color: #ff0077; box-shadow: 0 0 25px rgba(255, 0, 119, 0.6); transform: scale(1.02);
        }

        .btn-start-epic {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #ff0077 0%, #ff3300 100%);
            border: none; border-radius: 14px;
            color: #ffffff; font-family: 'Press Start 2P', monospace; font-size: 15px;
            cursor: pointer; box-shadow: 0 6px 0 #990033, 0 0 30px rgba(255, 0, 119, 0.7);
            transition: all 0.15s;
        }

        .btn-start-epic:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-start-epic:active { transform: translateY(4px); box-shadow: 0 2px 0 #990033; }

        /* UI ในเกม */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px 30px; display: none; justify-content: space-between;
            align-items: center; z-index: 20;
            font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px;
        }

        .hud-badge {
            background: rgba(8, 11, 28, 0.8);
            border: 2px solid #00f3ff; border-radius: 20px;
            padding: 8px 20px; color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            display: flex; gap: 8px; align-items: center;
        }

        #math-quiz {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: none;
            background: rgba(8, 11, 28, 0.9); border: 2px solid #ff0077;
            padding: 12px 35px; border-radius: 30px;
            font-family: 'Press Start 2P', monospace; font-size: 22px; color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 119, 0.6);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="space-canvas"></canvas>
    <canvas id="game-canvas"></canvas>

    <!-- 🌌 ฉากหลังเนบิวลา + อวกาศ -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="space-asset astronaut-large">👨‍🚀</div>
    <div class="space-asset planet-giant">🪐</div>
    <div class="bg-rocket">🚀</div>

    <!-- HUD แสดงคะแนน & เวลา -->
    <div id="hud-layer">
        <div class="hud-badge">SCORE: <span id="score-text" style="color:#fff">0</span></div>
        <div class="hud-badge" id="power-indicator" style="display:none; border-color:#ffea00; color:#ffea00;">RAPID FIRE!</div>
        <div class="hud-badge">TIME: <span id="time-text" style="color:#ff0077">60s</span></div>
    </div>

    <!-- โจทย์คณิตศาสตร์ -->
    <div id="math-quiz">? + ?</div>

    <!-- 🛸 Start Menu -->
    <div id="start-overlay">
        <div class="energy-ring"></div>
        <div class="energy-ring energy-ring-2"></div>

        <div class="glass-card-extreme">
            <div class="title-main">Game Design by<br>JIWJIW</div>
            <div class="title-sub">🚀 จรวดตะลุยอวกาศคณิตศาสตร์</div>
            <div class="instruction-text">กรอกชื่อผู้เล่นเพื่อเข้าสู่การรบอวกาศ</div>
            
            <form onsubmit="handleStart(event)">
                <input type="text" id="player-name" class="input-box-neon" placeholder="ป้อนชื่อผู้เล่น / ชื่อเล่น" required autocomplete="off">
                <button type="submit" class="btn-start-epic">START GAME</button>
            </form>
        </div>
    </div>
</div>

<script>
    // 🎵 Audio Synthesizer (SFX)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

    function soundLaser() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(950, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function soundExplode() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function soundPowerup() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    // 🌌 Canvas ฉากหลังดาวตก
    const spaceCanvas = document.getElementById('space-canvas');
    const spaceCtx = spaceCanvas.getContext('2d');
    let stars = [], shootingStars = [];

    function resizeSpace() {
        spaceCanvas.width = window.innerWidth;
        spaceCanvas.height = window.innerHeight;
    }

    function initStars() {
        stars = Array.from({ length: 180 }, () => ({
            x: Math.random() * spaceCanvas.width,
            y: Math.random() * spaceCanvas.height,
            size: Math.random() * 2.5 + 0.5,
            alpha: Math.random(),
            twinkleSpeed: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1)
        }));
    }

    function renderSpace() {
        spaceCtx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);
        stars.forEach(star => {
            star.alpha += star.twinkleSpeed;
            if (star.alpha >= 1 || star.alpha <= 0.1) star.twinkleSpeed = -star.twinkleSpeed;
            spaceCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
            spaceCtx.beginPath();
            spaceCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            spaceCtx.fill();
        });

        if (Math.random() < 0.03) {
            shootingStars.push({
                x: Math.random() * spaceCanvas.width * 1.2 - spaceCanvas.width * 0.1,
                y: Math.random() * (spaceCanvas.height * 0.5),
                length: Math.random() * 120 + 60,
                speed: Math.random() * 12 + 8,
                angle: Math.PI / 4, alpha: 1
            });
        }

        shootingStars.forEach((s, idx) => {
            s.x += Math.cos(s.angle) * s.speed;
            s.y += Math.sin(s.angle) * s.speed;
            s.alpha -= 0.012;

            const grad = spaceCtx.createLinearGradient(s.x, s.y, s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);
            grad.addColorStop(0, `rgba(0, 243, 255, ${s.alpha})`);
            grad.addColorStop(1, 'transparent');

            spaceCtx.strokeStyle = grad;
            spaceCtx.lineWidth = 3;
            spaceCtx.beginPath();
            spaceCtx.moveTo(s.x, s.y);
            spaceCtx.lineTo(s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);
            spaceCtx.stroke();

            if (s.alpha <= 0) shootingStars.splice(idx, 1);
        });

        requestAnimationFrame(renderSpace);
    }

    // 🚀 ระบบเกมเพลย์
    const gameCanvas = document.getElementById('game-canvas');
    const gameCtx = gameCanvas.getContext('2d');

    let isPlaying = false;
    let playerName = "";
    let score = 0, time = 60, timer = null;
    let screenShake = 0;

    const ship = { x: 0, y: 0, width: 45, speed: 12, powerTimer: 0, shootCooldown: 0 };
    const keys = { Left: false, Right: false, Space: false };
    let isTouching = false;
    let bullets = [], meteors = [], particles = [], powerups = [];
    let currentQuiz = { ans: 0 };

    function resizeGame() {
        gameCanvas.width = window.innerWidth;
        gameCanvas.height = window.innerHeight;
        ship.y = gameCanvas.height - 90;
        if (!isPlaying) ship.x = gameCanvas.width / 2;
    }

    window.addEventListener('resize', () => { resizeSpace(); initStars(); resizeGame(); });

    // Controls
    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = true;
        if (e.code === 'Space') keys.Space = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = false;
        if (e.code === 'Space') keys.Space = false;
    });

    gameCanvas.addEventListener('pointerdown', (e) => {
        if (!isPlaying) return;
        isTouching = true;
        ship.x = e.clientX;
    });

    gameCanvas.addEventListener('pointermove', (e) => {
        if (isPlaying && isTouching) ship.x = e.clientX;
    });

    gameCanvas.addEventListener('pointerup', () => { isTouching = false; });
    gameCanvas.addEventListener('pointercancel', () => { isTouching = false; });

    function fireBullet() {
        soundLaser();
        if (ship.powerTimer > 0) {
            bullets.push({ x: ship.x - 18, y: ship.y - 25, speed: 18 });
            bullets.push({ x: ship.x + 18, y: ship.y - 25, speed: 18 });
            bullets.push({ x: ship.x, y: ship.y - 35, speed: 20 });
        } else {
            bullets.push({ x: ship.x - 10, y: ship.y - 25, speed: 16 });
            bullets.push({ x: ship.x + 10, y: ship.y - 25, speed: 16 });
        }
    }

    function createExplosion(x, y, color) {
        soundExplode();
        screenShake = 12;
        for (let i = 0; i < 25; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 14,
                vy: (Math.random() - 0.5) * 14,
                size: Math.random() * 6 + 2,
                color: color || '#ff0077',
                alpha: 1
            });
        }
    }

    function handleStart(e) {
        e.preventDefault();
        initAudio();
        playerName = document.getElementById('player-name').value.trim();
        if (!playerName) return;

        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('hud-layer').style.display = 'flex';
        document.getElementById('math-quiz').style.display = 'block';

        score = 0; time = 60;
        document.getElementById('score-text').innerText = score;
        document.getElementById('time-text').innerText = time + 's';

        isPlaying = true;
        generateQuiz();

        clearInterval(timer);
        timer = setInterval(() => {
            time--;
            document.getElementById('time-text').innerText = time + 's';
            if (time <= 0) gameOver();
        }, 1000);

        requestAnimationFrame(gameLoop);
    }

    function generateQuiz() {
        const n1 = Math.floor(Math.random() * 12) + 1;
        const n2 = Math.floor(Math.random() * 12) + 1;
        const ans = n1 + n2;
        currentQuiz = { ans };

        document.getElementById('math-quiz').innerText = `${n1} + ${n2}`;

        let choices = [ans];
        while (choices.length < 4) {
            let wrong = ans + (Math.floor(Math.random() * 9) - 4);
            if (wrong > 0 && !choices.includes(wrong)) choices.push(wrong);
        }
        choices.sort(() => Math.random() - 0.5);

        const section = gameCanvas.width / 4;
        meteors = choices.map((val, idx) => ({
            x: section * idx + section / 2,
            y: -60,
            radius: 38,
            val: val,
            speed: 2.0 + Math.random() * 1.5
        }));
    }

    function gameLoop() {
        gameCtx.save();
        
        // Screen Shake Effect
        if (screenShake > 0) {
            gameCtx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.85;
            if (screenShake < 0.5) screenShake = 0;
        }

        gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

        if (!isPlaying) { gameCtx.restore(); return; }

        // Power-up Timer
        if (ship.powerTimer > 0) {
            ship.powerTimer--;
            document.getElementById('power-indicator').style.display = 'flex';
        } else {
            document.getElementById('power-indicator').style.display = 'none';
        }

        // Ship Movement
        if (keys.Left && ship.x > ship.width) ship.x -= ship.speed;
        if (keys.Right && ship.x < gameCanvas.width - ship.width) ship.x += ship.speed;

        // Auto Fire Mechanics (ยิงออโต้เมื่อกดค้าง)
        if (ship.shootCooldown > 0) ship.shootCooldown--;
        if ((keys.Space || isTouching) && ship.shootCooldown <= 0) {
            fireBullet();
            ship.shootCooldown = ship.powerTimer > 0 ? 5 : 9; // ยิงรัวขึ้นเมื่อมีไอเทม
        }

        // Draw Player Rocket
        gameCtx.shadowBlur = 20; gameCtx.shadowColor = '#00f3ff';
        gameCtx.fillStyle = '#ff0077';
        gameCtx.beginPath();
        gameCtx.moveTo(ship.x, ship.y - 30);
        gameCtx.lineTo(ship.x - 22, ship.y + 20);
        gameCtx.lineTo(ship.x + 22, ship.y + 20);
        gameCtx.fill();

        // Rocket Flame
        gameCtx.fillStyle = '#ffea00';
        gameCtx.beginPath();
        gameCtx.moveTo(ship.x - 10, ship.y + 20);
        gameCtx.lineTo(ship.x + 10, ship.y + 20);
        gameCtx.lineTo(ship.x, ship.y + 35 + Math.random() * 12);
        gameCtx.fill();
        gameCtx.shadowBlur = 0;

        // Bullets
        gameCtx.fillStyle = '#00f3ff';
        bullets.forEach((b, bi) => {
            b.y -= b.speed;
            gameCtx.shadowBlur = 12; gameCtx.shadowColor = '#00f3ff';
            gameCtx.beginPath();
            gameCtx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            gameCtx.fill();
            if (b.y < -10) bullets.splice(bi, 1);
        });
        gameCtx.shadowBlur = 0;

        // Meteors
        meteors.forEach((m) => {
            m.y += m.speed;
            if (m.y > gameCanvas.height + 60) m.y = -60;

            gameCtx.fillStyle = '#080b1c';
            gameCtx.strokeStyle = m.val === currentQuiz.ans ? '#00f3ff' : '#ff0077';
            gameCtx.lineWidth = 3;
            gameCtx.beginPath();
            gameCtx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
            gameCtx.fill(); gameCtx.stroke();

            gameCtx.fillStyle = '#fff';
            gameCtx.font = "700 20px 'Chakra Petch', sans-serif";
            gameCtx.textAlign = 'center';
            gameCtx.textBaseline = 'middle';
            gameCtx.fillText(m.val, m.x, m.y);

            // Collision Check with Bullets
            bullets.forEach((b, bi) => {
                if (Math.hypot(b.x - m.x, b.y - m.y) < m.radius + 8) {
                    bullets.splice(bi, 1);
                    createExplosion(m.x, m.y, m.val === currentQuiz.ans ? '#00f3ff' : '#ff0077');

                    if (m.val === currentQuiz.ans) {
                        score += 20;
                        document.getElementById('score-text').innerText = score;
                        
                        // Random Powerup Drop
                        if (Math.random() < 0.4) {
                            powerups.push({ x: m.x, y: m.y, type: 'RAPID' });
                        }
                        generateQuiz();
                    } else {
                        score = Math.max(0, score - 10);
                        document.getElementById('score-text').innerText = score;
                        m.y = -80;
                    }
                }
            });
        });

        // Powerups
        powerups.forEach((p, pi) => {
            p.y += 3.5;
            gameCtx.fillStyle = '#ffea00';
            gameCtx.font = "24px sans-serif";
            gameCtx.textAlign = 'center';
            gameCtx.fillText("⚡", p.x, p.y);

            if (Math.hypot(ship.x - p.x, ship.y - p.y) < 45) {
                soundPowerup();
                ship.powerTimer = 350; // ใช้งานได้ 6 วิ
                powerups.splice(pi, 1);
            }
            if (p.y > gameCanvas.height + 20) powerups.splice(pi, 1);
        });

        // Particles
        particles.forEach((pt, pti) => {
            pt.x += pt.vx; pt.y += pt.vy;
            pt.alpha -= 0.035;
            gameCtx.fillStyle = pt.color;
            gameCtx.globalAlpha = Math.max(0, pt.alpha);
            gameCtx.beginPath();
            gameCtx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
            gameCtx.fill();
            gameCtx.globalAlpha = 1;
            if (pt.alpha <= 0) particles.splice(pti, 1);
        });

        gameCtx.restore();
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(timer);
        alert(`🏆 จบการรบ! คุณ ${playerName}\nทำคะแนนรวมได้ทั้งหมด: ${score} คะแนน`);
        location.reload();
    }

    resizeSpace();
    initStars();
    renderSpace();
    resizeGame();
</script>
</body>
</html>
